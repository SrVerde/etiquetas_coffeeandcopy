<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etiquetas</title>
<style>
  :root {
    --bg: #f3f2ef; --panel: #ffffff; --ink: #1d1d1b; --muted: #6d6a64; --line: #e2dfd8;
    --accent: #1f5f5b; --accent-ink: #ffffff; --accent-soft: #e3efed; --danger: #a33a2c; --ok: #2e7d4f;
    --paper: #fffefa; --lh: 1.38em;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; }
  button, input { font: inherit; color: inherit; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  .adv { color: var(--muted); font-size: 13px; text-decoration: none; padding: 6px 8px; border-radius: 6px; }
  .adv:hover { background: var(--panel); color: var(--ink); }

  main { max-width: 560px; margin: 0 auto; padding: 0 16px 32px; display: grid; gap: 18px; }

  /* ── Campos ──────────────────────────────────────────── */
  .fields { display: grid; gap: 14px; }
  .field { display: grid; gap: 6px; }
  .field .lbl { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .field .name { font-size: 18px; font-weight: 600; }
  .field .hint { font-size: 13px; color: var(--muted); }
  .field input { width: 100%; font-size: 30px; font-weight: 600; padding: 14px 16px; border: 2px solid #c9c4b9;
    border-radius: 10px; background: #fff; min-width: 0; }
  .field input::placeholder { color: #b9b3a7; font-weight: 400; }
  .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }

  /* ── Botón imprimir ──────────────────────────────────── */
  #btnPrint { width: 100%; border: 0; border-radius: 12px; padding: 18px; font-size: 24px; font-weight: 700;
    background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  #btnPrint:hover { filter: brightness(1.08); }
  #btnPrint:disabled { opacity: .7; cursor: progress; }
  #btnPrint.ok { background: var(--ok); }
  .msg { min-height: 1.4em; margin: -8px 0 0; text-align: center; font-size: 15px; }
  .msg.err { color: var(--danger); font-weight: 600; }

  /* ── Vista previa (igual que en Avanzado) ────────────── */
  .cap { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  .liner { background: #ebe7dc; padding: 14px 10px; border-radius: 6px; overflow-x: auto; }
  .sticker { background: var(--paper); border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.12); margin: 0 auto;
    width: max-content; padding: 14px 12px; font-family: Consolas, "Cascadia Mono", "Courier New", monospace; font-size: 13px; }
  .paper { width: calc(var(--cols) * 1ch); }
  .ln { height: var(--lh); line-height: var(--lh); white-space: pre; overflow: visible; }
  .ln .sp { display: inline-block; }
  .ln .box { display: inline-block; vertical-align: top; overflow: visible; }
  .ln .box > span { display: inline-block; transform-origin: 0 0; line-height: var(--lh); }
  .ln.b { font-weight: 700; }
  .ph { color: #b9b3a7; }
  .bc { margin: 4px auto; text-align: center; font-size: 12px; }
  .bc .bars { height: 40px; margin: 0 auto 2px; width: 70%;
    background: repeating-linear-gradient(90deg, #1d1d1b 0 2px, transparent 2px 4px, #1d1d1b 4px 5px, transparent 5px 8px); }
  .qr { width: 90px; height: 90px; margin: 4px auto; border: 6px solid #1d1d1b; display: grid; place-items: center; font-size: 12px; }
  .cut { border-top: 1px dashed #b8b2a5; margin: 10px -12px 0; position: relative; height: 0; }
  .cut::after { content: "✂"; position: absolute; right: -2px; top: -11px; font-size: 13px; color: #9a9385; }
</style>
</head>
<body>
<header>
  <h1>Etiquetas</h1>
  <a class="adv" href="/avanzado.html" title="Editar plantillas">Avanzado</a>
</header>

<main>
  <form class="fields" id="fields" autocomplete="off"></form>

  <button id="btnPrint" type="button">Imprimir</button>
  <p class="msg" id="msg" role="status"></p>

  <section>
    <p class="cap">Así se verá:</p>
    <div class="liner"><div class="sticker"><div class="paper" id="paper"></div></div></div>
  </section>
</main>

<script>
'use strict';
const $ = s => document.querySelector(s);
const VAR_RE = /\{\{\s*([\w.-]+)\s*\}\}/g;
// Variables automáticas: las llena el servidor al imprimir; aquí solo se muestran
function autoVars(d = new Date()) {
  const p = n => String(n).padStart(2, '0');
  const fecha = `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()}`, hora = `${p(d.getHours())}:${p(d.getMinutes())}`;
  return { fecha, hora, fecha_hora: `${fecha} ${hora}` };
}
const AUTO = Object.keys(autoVars());
const SIZE_NAMES = { '1x1': 'Letra normal', '2x1': 'Letra ancha', '1x2': 'Letra alta', '2x2': 'Letra grande', '3x3': 'Letra enorme' };

let COLS = 38;
let home = { template: null, ticket: [] };
let fields = [];          // [{ key, label, hint }]
const data = {};

// "precio_venta" → "Precio venta"
const humanize = k => { const s = k.replace(/[_.-]+/g, ' ').trim(); return s.charAt(0).toUpperCase() + s.slice(1); };

/** Campos de la plantilla, en orden de aparición, con el tipo de letra donde se usan. */
function fieldsOf(ticket) {
  const out = new Map();
  for (const e of ticket) {
    const texts = [e.value, e.char, ...(e.columns ?? []).map(c => c.text)];
    for (const t of texts) for (const m of String(t ?? '').matchAll(VAR_RE)) {
      if (out.has(m[1]) || AUTO.includes(m[1])) continue;
      let hint = 'Letra normal';
      if (e.type === 'text') {
        const [w, h] = e.size ?? [1, 1];
        hint = SIZE_NAMES[`${w}x${h}`] ?? `Letra ${w}×${h}`;
        if (w > 1) hint += ` · ${Math.floor(COLS / w)} letras por línea`;
      } else if (e.type === 'barcode') hint = 'Código de barras';
      else if (e.type === 'qr') hint = 'Código QR';
      out.set(m[1], { key: m[1], label: humanize(m[1]), hint });
    }
  }
  return [...out.values()];
}

/** Texto → lista de letras; las de un campo vacío se marcan como placeholder. */
function richText(value) {
  const chars = [];
  let last = 0;
  const push = (s, ph) => { for (const ch of s) chars.push({ ch, ph }); };
  const auto = autoVars();
  for (const m of String(value ?? '').matchAll(VAR_RE)) {
    push(value.slice(last, m.index), false);
    const v = AUTO.includes(m[1]) ? auto[m[1]] : data[m[1]];
    if (v) push(v, false); else push(humanize(m[1]), true);
    last = m.index + m[0].length;
  }
  push(String(value ?? '').slice(last), false);
  return chars;
}
const plain = value => richText(value).map(c => c.ch).join('');

/** Igual que wrapWords de printer.js, pero conservando la marca de cada letra. */
function wrapRich(chars, width) {
  if (width <= 0) return [[]];
  const words = [[]];
  for (const c of chars) c.ch === ' ' ? words.push([]) : words.at(-1).push(c);
  const lines = []; let cur = [];
  for (let token of words) {
    while (token.length > width) { if (cur.length) { lines.push(cur); cur = []; } lines.push(token.slice(0, width)); token = token.slice(width); }
    if (!token.length) continue;
    if (cur.length && cur.length + 1 + token.length > width) { lines.push(cur); cur = token; }
    else cur = cur.length ? [...cur, { ch: ' ', ph: cur.at(-1).ph && token[0].ph }, ...token] : token;
  }
  if (cur.length) lines.push(cur);
  return lines.length ? lines : [[]];
}

// ── Vista previa ─────────────────────────────────────────────────────────
function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

function line({ lead = 0, chars = [], sw = 1, sh = 1, bold = false }) {
  const d = el('div', 'ln' + (bold ? ' b' : ''));
  d.style.height = `calc(var(--lh) * ${sh})`;
  const sp = el('span', 'sp'); sp.style.width = lead + 'ch'; d.append(sp);
  const box = el('span', 'box'); box.style.width = (chars.length * sw) + 'ch'; box.style.height = `calc(var(--lh) * ${sh})`;
  const inner = el('span'); inner.style.transform = `scale(${sw}, ${sh})`;
  // agrupa letras seguidas con la misma marca
  for (let i = 0; i < chars.length;) {
    let j = i; while (j < chars.length && chars[j].ph === chars[i].ph) j++;
    inner.append(el('span', chars[i].ph ? 'ph' : null, chars.slice(i, j).map(c => c.ch).join('')));
    i = j;
  }
  box.append(inner); d.append(box);
  return d;
}

function renderPreview() {
  const paper = $('#paper');
  paper.style.setProperty('--cols', COLS);
  paper.replaceChildren();
  for (const e of home.ticket) {
    switch (e.type) {
      case 'text': {
        const [sw, sh] = e.size ?? [1, 1];
        for (const chars of wrapRich(richText(e.value), Math.max(1, Math.floor(COLS / sw)))) {
          const free = Math.max(0, COLS - chars.length * sw);
          const lead = e.align === 'right' ? free : e.align === 'center' ? Math.floor(free / 2) : 0;
          paper.append(line({ lead, chars, sw, sh, bold: e.bold }));
        }
        break;
      }
      case 'separator': paper.append(line({ chars: richText((e.char || '-')[0].repeat(COLS)) })); break;
      case 'feed': for (let k = 0; k < (e.lines || 1); k++) paper.append(line({})); break;
      case 'row': {
        const txt = (e.columns ?? []).map(c => {
          const s = plain(c.text).slice(0, c.width), pad = c.width - s.length;
          return c.align === 'right' ? s.padStart(c.width) : c.align === 'center' ? ' '.repeat(pad >> 1) + s + ' '.repeat(pad - (pad >> 1)) : s.padEnd(c.width);
        }).join('');
        paper.append(line({ chars: [...txt].map(ch => ({ ch, ph: false })), bold: e.bold })); break;
      }
      case 'barcode': { const b = el('div', 'bc'); b.append(el('div', 'bars'), el('div', null, plain(e.value))); paper.append(b); break; }
      case 'qr': paper.append(el('div', 'qr', 'QR')); break;
      case 'cut': paper.append(el('div', 'cut')); break;
    }
  }
  if (!home.ticket.some(e => e.type === 'cut')) paper.append(el('div', 'cut'));
}

// ── Campos ───────────────────────────────────────────────────────────────
function renderFields() {
  const form = $('#fields');
  form.replaceChildren();
  for (const f of fields) {
    const wrap = el('label', 'field');
    const lbl = el('span', 'lbl');
    lbl.append(el('span', 'name', f.label), el('span', 'hint', f.hint));
    const inp = el('input'); inp.type = 'text'; inp.name = f.key; inp.placeholder = f.label;
    inp.maxLength = 300; inp.enterKeyHint = 'go';
    inp.oninput = () => { data[f.key] = inp.value; setMsg(''); renderPreview(); };
    wrap.append(lbl, inp);
    form.append(wrap);
  }
  form.onsubmit = ev => { ev.preventDefault(); print(); };   // Enter imprime
  form.querySelector('input')?.focus();
}

// ── Imprimir ─────────────────────────────────────────────────────────────
function setMsg(text, err = false) { const m = $('#msg'); m.textContent = text; m.className = 'msg' + (err ? ' err' : ''); }

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && j.login) { location.href = '/login.html'; throw new Error(j.error); }
  if (!r.ok) throw new Error(j.error || `Error ${r.status}`);
  return j;
}

let busy = false;
async function print() {
  if (busy) return;
  if (fields.length && fields.every(f => !String(data[f.key] ?? '').trim())) {
    setMsg(`Escribe ${fields.length > 1 ? 'algo en los campos' : 'el texto'} antes de imprimir`, true);
    $('#fields input')?.focus();
    return;
  }
  busy = true;
  const btn = $('#btnPrint'); btn.disabled = true; btn.textContent = 'Imprimiendo…'; setMsg('');
  // los campos vacíos se imprimen en blanco, nunca como {{campo}}
  const values = Object.fromEntries(fields.map(f => [f.key, String(data[f.key] ?? '').trim()]));
  try {
    await api('/api/print', { method: 'POST', body: JSON.stringify(
      home.template ? { template: home.template, data: values } : { ticket: home.ticket, data: values }) });
    btn.classList.add('ok'); btn.textContent = '✓ Listo';
    setTimeout(() => { btn.classList.remove('ok'); btn.textContent = 'Imprimir'; }, 2000);
    $('#fields input')?.select();   // para escribir la siguiente encima
  } catch (e) {
    btn.textContent = 'Imprimir';
    setMsg('No se pudo imprimir. Revisa que la impresora esté encendida y con papel. (' + e.message + ')', true);
  } finally { btn.disabled = false; busy = false; }
}
$('#btnPrint').onclick = print;

// ── Inicio ───────────────────────────────────────────────────────────────
(async () => {
  try {
    const [cfg, h] = await Promise.all([api('/api/config'), api('/api/home')]);
    COLS = cfg.columns || 38;
    home = h;
    fields = fieldsOf(home.ticket);
  } catch (e) { setMsg('Sin conexión con el servidor: ' + e.message, true); }
  renderFields();
  renderPreview();
  setInterval(renderPreview, 30000);   // la hora de la vista previa
})();
</script>
</body>
</html>
